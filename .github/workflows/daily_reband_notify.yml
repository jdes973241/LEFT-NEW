name: Daily REBAND_HF0_200_0 Signal & Portfolio Change Notifier

on:
  # 每個美股交易日收盤後自動執行：
  # 設於 22:23 UTC (週一至週五) = 台灣時間週二至週六早上 06:23
  # 避開全球整點擁塞，且美股收盤後已有足夠時間結算，100% 確保包含最新一個交易日收盤價！
  schedule:
    - cron: '23 22 * * 1-5'

  # 支援手動一鍵點擊「Run workflow」立即測試收信
  workflow_dispatch:
    inputs:
      force_send:
        description: '是否強制發送測試通知'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance pandas numpy scipy arch pytz

      - name: Run REBAND_HF0_200_0 Change Detection & Notification
        env:
          ACCOUNT_NAV: ${{ secrets.ACCOUNT_NAV || '100000' }}
          # 設為 false 代表每個交易日早上 06:23 都會寄巡檢信給你
          NOTIFY_ONLY_ON_CHANGE: 'false'
          FORCE_SEND: ${{ github.event.inputs.force_send || 'false' }}

          # Email 與推播金鑰 (讀取你在 GitHub Secrets 設定的變數)
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
          BARK_URL: ${{ secrets.BARK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python notify_reband_changes.py
